<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#5b73e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <title>我的工作台</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 顶部栏 -->
    <header class="topbar">
      <div class="topbar-title" id="pageTitle">今日</div>
      <div class="topbar-right">
        <div class="topbar-date" id="topbarDate"></div>
        <button class="topbar-btn" id="searchBtn" aria-label="搜索">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        </button>
      </div>
    </header>

    <!-- 页面容器 -->
    <main id="main"></main>

    <!-- 底部导航（由 JS 渲染） -->
    <nav class="bottom-nav"></nav>

    <!-- 浮动添加按钮 -->
    <button id="fab" class="fab" aria-label="添加">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>

    <!-- 弹窗 -->
    <div id="modal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-box">
        <div class="modal-header">
          <span id="modalTitle">标题</span>
          <button id="modalClose" class="modal-close" aria-label="关闭">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <div id="modalBody" class="modal-body"></div>
      </div>
    </div>

    <!-- 提示 -->
    <div id="toast" class="toast"></div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/lunar.js"></script>
  <script src="js/vault.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
